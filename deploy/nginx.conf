server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version.
    server_tokens off;

    # ---------- compression ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- security headers ----------
    # Included again inside locations that declare their own add_header:
    # nginx does not inherit add_header directives when a location overrides them.
    include /etc/nginx/security-headers.conf;

    # ---------- caching ----------
    # Immutable hashed assets from Vite.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Always revalidate the entry document.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # Resume PDF: display in browser, keep a short cache.
    location = /Blokhin-CV.pdf {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "inline; filename=\"Blokhin-CV.pdf\"" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # HashRouter means client-side routing lives behind #, but the fallback
    # also makes direct asset requests and future history-mode routing safe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon: cache for a week.
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
