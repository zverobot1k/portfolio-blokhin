<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Максим Блохин — Backend Developer</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('blokhin-theme')
          document.documentElement.dataset.theme =
            stored === 'dark' || stored === 'light' ? stored : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="Портфолио Максима Блохина — backend-разработчика. Go, Python, PostgreSQL, Redis, Docker. Проекты, стек и резюме."
    />
    <meta property="og:title" content="Максим Блохин — Backend Developer" />
    <meta
      property="og:description"
      content="Портфолио backend-разработчика: Go, Python, API, пайплайны данных. Терминал в браузере."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
